<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Weight Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen">
    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-600">Loading...</p>
        </div>
    </div>

    <div id="app" class="hidden pb-20">
        <!-- Header -->
        <header class="bg-white/10 backdrop-blur-lg text-white p-4 sticky top-0 z-40">
            <div class="flex justify-between items-center max-w-lg mx-auto">
                <a href="index.html" class="text-2xl">←</a>
                <h1 class="text-xl font-bold">Weight Tracking</h1>
                <div class="w-8"></div>
            </div>
        </header>

        <main class="max-w-lg mx-auto p-4 space-y-4">
            <!-- Log Weight Card -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Log Today's Weight</h2>
                <form id="weightForm" onsubmit="logWeight(event)" class="space-y-4">
                    <div class="flex gap-4">
                        <input type="number" id="weightInput" step="0.1" required
                            class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent text-2xl text-center"
                            placeholder="0.0">
                        <span class="flex items-center text-gray-500 text-xl">lbs</span>
                    </div>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 rounded-xl hover:opacity-90 transition">
                        Log Weight
                    </button>
                </form>
                <div id="weightSuccess" class="hidden mt-4 bg-green-50 text-green-600 p-4 rounded-xl text-center">
                    Weight logged successfully!
                </div>
            </div>

            <!-- Current Stats -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Your Stats</h2>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <p class="text-sm text-gray-500">Start</p>
                        <p class="text-xl font-bold text-gray-800" id="startWeight">--</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Current</p>
                        <p class="text-xl font-bold text-primary" id="currentWeight">--</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Goal</p>
                        <p class="text-xl font-bold text-green-500" id="goalWeight">--</p>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="mt-4">
                    <div class="flex justify-between text-sm text-gray-500 mb-1">
                        <span>Progress to goal</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="h-3 bg-gray-100 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-gradient-to-r from-primary to-secondary rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Weight History -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Weight History</h2>
                <div id="weightHistory" class="space-y-3">
                    <!-- Weight entries will be added here -->
                </div>
                <p id="noWeights" class="text-gray-500 text-center py-4 hidden">No weight entries yet</p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
            <div class="flex justify-around max-w-lg mx-auto">
                <a href="index.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">🏠</span>
                    <span class="text-xs mt-1">Home</span>
                </a>
                <a href="weight.html" class="flex flex-col items-center py-3 px-6 text-primary">
                    <span class="text-2xl">⚖️</span>
                    <span class="text-xs mt-1">Weight</span>
                </a>
                <a href="food.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">🍎</span>
                    <span class="text-xs mt-1">Food</span>
                </a>
                <a href="workouts.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">💪</span>
                    <span class="text-xs mt-1">Workouts</span>
                </a>
                <a href="friend.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">👥</span>
                    <span class="text-xs mt-1">Buddy</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        let currentUser = null;
        let userData = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            await loadUserData();
            await loadWeightHistory();
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        });

        async function loadUserData() {
            const doc = await firebase.firestore().collection('users').doc(currentUser.uid).get();
            userData = doc.data();

            document.getElementById('startWeight').textContent = userData.startWeight + ' lbs';
            document.getElementById('currentWeight').textContent = userData.currentWeight + ' lbs';
            document.getElementById('goalWeight').textContent = userData.goalWeight + ' lbs';

            // Calculate progress
            const totalToLose = userData.startWeight - userData.goalWeight;
            const lost = userData.startWeight - userData.currentWeight;
            const progress = totalToLose > 0 ? Math.min(100, Math.max(0, (lost / totalToLose) * 100)) : 0;

            document.getElementById('progressPercent').textContent = Math.round(progress) + '%';
            document.getElementById('progressBar').style.width = progress + '%';
        }

        async function loadWeightHistory() {
            const snapshot = await firebase.firestore()
                .collection('users').doc(currentUser.uid)
                .collection('weights')
                .orderBy('date', 'desc')
                .limit(30)
                .get();

            const container = document.getElementById('weightHistory');
            container.innerHTML = '';

            if (snapshot.empty) {
                document.getElementById('noWeights').classList.remove('hidden');
                return;
            }

            document.getElementById('noWeights').classList.add('hidden');

            let prevWeight = null;
            snapshot.docs.reverse().forEach((doc, index) => {
                const data = doc.data();
                const date = data.date?.toDate() || new Date();
                const weight = data.weight;

                let changeClass = 'text-gray-400';
                let changeText = '';

                if (prevWeight !== null) {
                    const diff = weight - prevWeight;
                    if (diff < 0) {
                        changeClass = 'text-green-500';
                        changeText = `↓ ${Math.abs(diff).toFixed(1)}`;
                    } else if (diff > 0) {
                        changeClass = 'text-red-500';
                        changeText = `↑ ${diff.toFixed(1)}`;
                    } else {
                        changeText = '−';
                    }
                }
                prevWeight = weight;

                const entry = document.createElement('div');
                entry.className = 'flex justify-between items-center py-2 border-b border-gray-100 last:border-0';
                entry.innerHTML = `
                    <div>
                        <p class="font-medium text-gray-800">${weight} lbs</p>
                        <p class="text-sm text-gray-500">${formatDate(date)}</p>
                    </div>
                    <span class="${changeClass} font-medium">${changeText}</span>
                `;
                container.appendChild(entry);
            });

            // Reverse to show newest first
            const entries = Array.from(container.children);
            container.innerHTML = '';
            entries.reverse().forEach(entry => container.appendChild(entry));
        }

        function formatDate(date) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return 'Today';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Yesterday';
            } else {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }

        async function logWeight(e) {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('weightInput').value);

            // Add to weights collection
            await firebase.firestore()
                .collection('users').doc(currentUser.uid)
                .collection('weights').add({
                    weight: weight,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });

            // Update current weight in user profile
            await firebase.firestore()
                .collection('users').doc(currentUser.uid)
                .update({ currentWeight: weight });

            // Show success message
            document.getElementById('weightSuccess').classList.remove('hidden');
            document.getElementById('weightInput').value = '';

            // Reload data
            await loadUserData();
            await loadWeightHistory();

            // Hide success after 3 seconds
            setTimeout(() => {
                document.getElementById('weightSuccess').classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
