<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Food Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen">
    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-gray-600">Loading...</p>
        </div>
    </div>

    <div id="app" class="hidden pb-20">
        <!-- Header -->
        <header class="bg-white/10 backdrop-blur-lg text-white p-4 sticky top-0 z-40">
            <div class="flex justify-between items-center max-w-lg mx-auto">
                <a href="index.html" class="text-2xl">←</a>
                <h1 class="text-xl font-bold">Food Tracking</h1>
                <div class="w-8"></div>
            </div>
        </header>

        <main class="max-w-lg mx-auto p-4 space-y-4">
            <!-- Daily Calories Summary -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Today's Calories</h2>
                <div class="text-center">
                    <p class="text-5xl font-bold text-primary" id="todayCalories">0</p>
                    <p class="text-gray-500 mt-1">calories consumed</p>
                </div>
                <div class="mt-4 grid grid-cols-3 gap-4 text-center text-sm">
                    <div class="bg-green-50 rounded-xl p-3">
                        <p class="text-green-600 font-bold" id="proteinTotal">0g</p>
                        <p class="text-gray-500">Protein</p>
                    </div>
                    <div class="bg-yellow-50 rounded-xl p-3">
                        <p class="text-yellow-600 font-bold" id="carbsTotal">0g</p>
                        <p class="text-gray-500">Carbs</p>
                    </div>
                    <div class="bg-red-50 rounded-xl p-3">
                        <p class="text-red-600 font-bold" id="fatTotal">0g</p>
                        <p class="text-gray-500">Fat</p>
                    </div>
                </div>
            </div>

            <!-- Log Food Card -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Log Food</h2>
                <form id="foodForm" onsubmit="logFood(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">What did you eat?</label>
                        <input type="text" id="foodName" required
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="e.g., Chicken salad">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Calories</label>
                            <input type="number" id="foodCalories" required
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Meal</label>
                            <select id="foodMeal"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                                <option value="snack">Snack</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Protein (g)</label>
                            <input type="number" id="foodProtein"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Carbs (g)</label>
                            <input type="number" id="foodCarbs"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="0">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fat (g)</label>
                            <input type="number" id="foodFat"
                                class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent"
                                placeholder="0">
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 rounded-xl hover:opacity-90 transition">
                        Log Food
                    </button>
                </form>
                <div id="foodSuccess" class="hidden mt-4 bg-green-50 text-green-600 p-4 rounded-xl text-center">
                    Food logged successfully!
                </div>
            </div>

            <!-- Today's Food Log -->
            <div class="bg-white rounded-2xl p-6 shadow-xl">
                <h2 class="text-lg font-semibold text-gray-800 mb-4">Today's Log</h2>
                <div id="foodLog" class="space-y-3">
                    <!-- Food entries will be added here -->
                </div>
                <p id="noFood" class="text-gray-500 text-center py-4 hidden">No food logged today</p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
            <div class="flex justify-around max-w-lg mx-auto">
                <a href="index.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">🏠</span>
                    <span class="text-xs mt-1">Home</span>
                </a>
                <a href="weight.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">⚖️</span>
                    <span class="text-xs mt-1">Weight</span>
                </a>
                <a href="food.html" class="flex flex-col items-center py-3 px-6 text-primary">
                    <span class="text-2xl">🍎</span>
                    <span class="text-xs mt-1">Food</span>
                </a>
                <a href="workouts.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">💪</span>
                    <span class="text-xs mt-1">Workouts</span>
                </a>
                <a href="friend.html" class="flex flex-col items-center py-3 px-6 text-gray-400 hover:text-primary transition">
                    <span class="text-2xl">👥</span>
                    <span class="text-xs mt-1">Buddy</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        let currentUser = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            await loadTodayFood();
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        });

        async function loadTodayFood() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const snapshot = await firebase.firestore()
                .collection('users').doc(currentUser.uid)
                .collection('food')
                .where('date', '>=', today)
                .orderBy('date', 'desc')
                .get();

            const container = document.getElementById('foodLog');
            container.innerHTML = '';

            let totalCalories = 0;
            let totalProtein = 0;
            let totalCarbs = 0;
            let totalFat = 0;

            if (snapshot.empty) {
                document.getElementById('noFood').classList.remove('hidden');
            } else {
                document.getElementById('noFood').classList.add('hidden');

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    totalCalories += data.calories || 0;
                    totalProtein += data.protein || 0;
                    totalCarbs += data.carbs || 0;
                    totalFat += data.fat || 0;

                    const mealEmoji = {
                        breakfast: '🌅',
                        lunch: '☀️',
                        dinner: '🌙',
                        snack: '🍿'
                    }[data.meal] || '🍽️';

                    const entry = document.createElement('div');
                    entry.className = 'flex justify-between items-center py-3 border-b border-gray-100 last:border-0';
                    entry.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${mealEmoji}</span>
                            <div>
                                <p class="font-medium text-gray-800">${data.name}</p>
                                <p class="text-sm text-gray-500 capitalize">${data.meal}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-primary">${data.calories} cal</p>
                            <button onclick="deleteFood('${doc.id}')" class="text-xs text-red-400 hover:text-red-600">Delete</button>
                        </div>
                    `;
                    container.appendChild(entry);
                });
            }

            document.getElementById('todayCalories').textContent = totalCalories;
            document.getElementById('proteinTotal').textContent = totalProtein + 'g';
            document.getElementById('carbsTotal').textContent = totalCarbs + 'g';
            document.getElementById('fatTotal').textContent = totalFat + 'g';
        }

        async function logFood(e) {
            e.preventDefault();

            const food = {
                name: document.getElementById('foodName').value,
                calories: parseInt(document.getElementById('foodCalories').value) || 0,
                meal: document.getElementById('foodMeal').value,
                protein: parseInt(document.getElementById('foodProtein').value) || 0,
                carbs: parseInt(document.getElementById('foodCarbs').value) || 0,
                fat: parseInt(document.getElementById('foodFat').value) || 0,
                date: firebase.firestore.FieldValue.serverTimestamp()
            };

            await firebase.firestore()
                .collection('users').doc(currentUser.uid)
                .collection('food').add(food);

            // Show success message
            document.getElementById('foodSuccess').classList.remove('hidden');

            // Clear form
            document.getElementById('foodForm').reset();

            // Reload data
            await loadTodayFood();

            // Hide success after 3 seconds
            setTimeout(() => {
                document.getElementById('foodSuccess').classList.add('hidden');
            }, 3000);
        }

        async function deleteFood(id) {
            if (confirm('Delete this food entry?')) {
                await firebase.firestore()
                    .collection('users').doc(currentUser.uid)
                    .collection('food').doc(id).delete();
                await loadTodayFood();
            }
        }
    </script>
</body>
</html>
