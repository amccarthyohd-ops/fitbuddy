<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                FitBuddy
            </h1>
            <p class="text-gray-500 mt-2">Track your fitness journey together</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
            <button id="loginTab" onclick="showLogin()" class="flex-1 py-2 rounded-lg font-medium transition bg-white text-primary shadow">
                Login
            </button>
            <button id="signupTab" onclick="showSignup()" class="flex-1 py-2 rounded-lg font-medium transition text-gray-500">
                Sign Up
            </button>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-xl p-4 mb-4">
            <p id="errorText"></p>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-600 rounded-xl p-4 mb-4">
            <p id="successText"></p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="loginEmail" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="loginPassword" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="••••••••">
            </div>
            <button type="submit" id="loginButton"
                class="w-full bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 rounded-xl hover:opacity-90 transition">
                Login
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="signupName" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="Your name">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="signupEmail" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="signupPassword" required minlength="6"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="At least 6 characters">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Starting Weight (lbs)</label>
                <input type="number" id="signupWeight" required step="0.1"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="e.g., 180">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Goal Weight (lbs)</label>
                <input type="number" id="signupGoalWeight" required step="0.1"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="e.g., 160">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Buddy Code (optional)</label>
                <input type="text" id="signupBuddyCode"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition"
                    placeholder="Enter your friend's code">
                <p class="text-xs text-gray-500 mt-1">Don't have one? You'll get your own code to share!</p>
            </div>
            <button type="submit" id="signupButton"
                class="w-full bg-gradient-to-r from-primary to-secondary text-white font-medium py-3 rounded-xl hover:opacity-90 transition">
                Create Account
            </button>
        </form>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Check if already logged in
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginTab').classList.add('bg-white', 'text-primary', 'shadow');
            document.getElementById('loginTab').classList.remove('text-gray-500');
            document.getElementById('signupTab').classList.remove('bg-white', 'text-primary', 'shadow');
            document.getElementById('signupTab').classList.add('text-gray-500');
            hideMessages();
        }

        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('signupTab').classList.add('bg-white', 'text-primary', 'shadow');
            document.getElementById('signupTab').classList.remove('text-gray-500');
            document.getElementById('loginTab').classList.remove('bg-white', 'text-primary', 'shadow');
            document.getElementById('loginTab').classList.add('text-gray-500');
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('successMessage').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');
        }

        function showSuccess(message) {
            document.getElementById('successText').textContent = message;
            document.getElementById('successMessage').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const button = document.getElementById('loginButton');

            button.textContent = 'Logging in...';
            button.disabled = true;

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                window.location.href = 'index.html';
            } catch (error) {
                showError(error.message);
                button.textContent = 'Login';
                button.disabled = false;
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const weight = parseFloat(document.getElementById('signupWeight').value);
            const goalWeight = parseFloat(document.getElementById('signupGoalWeight').value);
            const buddyCode = document.getElementById('signupBuddyCode').value.trim();
            const button = document.getElementById('signupButton');

            button.textContent = 'Creating account...';
            button.disabled = true;

            try {
                // Create user account
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Generate a buddy code for this user
                const myBuddyCode = generateBuddyCode();

                // Create user profile in Firestore
                await firebase.firestore().collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    startWeight: weight,
                    currentWeight: weight,
                    goalWeight: goalWeight,
                    buddyCode: myBuddyCode,
                    buddyId: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Log initial weight
                await firebase.firestore().collection('users').doc(user.uid).collection('weights').add({
                    weight: weight,
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });

                // If buddy code provided, link the buddies
                if (buddyCode) {
                    const buddyQuery = await firebase.firestore().collection('users')
                        .where('buddyCode', '==', buddyCode.toUpperCase())
                        .get();

                    if (!buddyQuery.empty) {
                        const buddyDoc = buddyQuery.docs[0];
                        // Link both users as buddies
                        await firebase.firestore().collection('users').doc(user.uid).update({
                            buddyId: buddyDoc.id
                        });
                        await firebase.firestore().collection('users').doc(buddyDoc.id).update({
                            buddyId: user.uid
                        });
                    }
                }

                window.location.href = 'index.html';
            } catch (error) {
                showError(error.message);
                button.textContent = 'Create Account';
                button.disabled = false;
            }
        }

        function generateBuddyCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }
    </script>
</body>
</html>
