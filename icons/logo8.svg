<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <defs>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="190" height="190" rx="40" fill="url(#grad8)"/>

  <!-- Crossed dumbbells -->
  <!-- Dumbbell 1 (diagonal) -->
  <g transform="rotate(-45, 100, 100)">
    <rect x="30" y="90" width="25" height="40" rx="5" fill="white"/>
    <rect x="55" y="100" width="90" height="20" rx="10" fill="rgba(255,255,255,0.85)"/>
    <rect x="145" y="90" width="25" height="40" rx="5" fill="white"/>
  </g>

  <!-- Dumbbell 2 (other diagonal) -->
  <g transform="rotate(45, 100, 100)">
    <rect x="30" y="90" width="25" height="40" rx="5" fill="rgba(255,255,255,0.9)"/>
    <rect x="55" y="100" width="90" height="20" rx="10" fill="rgba(255,255,255,0.75)"/>
    <rect x="145" y="90" width="25" height="40" rx="5" fill="rgba(255,255,255,0.9)"/>
  </g>
</svg>
