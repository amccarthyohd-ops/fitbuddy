  <circle cx="100" cy="100" r="20" fill="url(#grad9)"/>

  <!-- Text -->
  <text x="100" y="75" font-size="20" font-weight="bold" text-anchor="middle" fill="url(#grad9)" font-family="Arial, sans-serif">FIT</text>
  <text x="100" y="145" font-size="16" font-weight="bold" text-anchor="middle" fill="url(#grad9)" font-family="Arial, sans-serif">BUDDY</text>
